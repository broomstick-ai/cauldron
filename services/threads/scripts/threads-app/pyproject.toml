[project]
name = "threads-tui"
version = "1.0.0"
description = "The threads board: an API-backed Textual interface to this machine's Claude account pool"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["threads_tui"]
